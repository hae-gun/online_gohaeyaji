name: Deploy frontend to GitHub Pages

# Builds frontend/ and publishes it to https://<owner>.github.io/<repo>/
# Runs on every push to main that touches the frontend, or by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The real answer copy and word lists are not in the repo.
      # If these repository secrets exist, they are written into public/data before the build.
      # Without them the site falls back to the *.sample.json files.
      - name: Write private data files from secrets
        env:
          ANSWERS_JSON: ${{ secrets.ANSWERS_JSON }}
          SAFETY_JSON: ${{ secrets.SAFETY_JSON }}
          BLOCKED_JSON: ${{ secrets.BLOCKED_JSON }}
        run: |
          write() {
            name="$1"; value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" > "public/data/$name"
              node -e "JSON.parse(require('fs').readFileSync('public/data/$name','utf8'))" \
                || { echo "::error::$name secret is not valid JSON"; exit 1; }
              echo "$name: from secret"
            else
              echo "$name: no secret, sample will be used"
            fi
          }
          write answers.json "$ANSWERS_JSON"
          write safety.json  "$SAFETY_JSON"
          write blocked.json "$BLOCKED_JSON"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
