name: Deploy frontend to GitHub Pages

# Builds frontend/ and publishes it to https://<owner>.github.io/<repo>/
# Runs on every push to main that touches the frontend, or by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The real answer copy and word lists are not in the repo.
      # If these repository secrets exist, they are written into public/data before the build.
      # Without them the site falls back to the *.sample.json files.
      # A secret holds at most 48 KB, so each file can also be stored gzipped and base64 encoded
      # as <NAME>_GZ (scripts/set-data-secrets.sh does this). The _GZ secret wins when both exist.
      # When even that is too long, it is cut into <NAME>_GZ, <NAME>_GZ_2, ... _6 and glued here.
      - name: Write private data files from secrets
        env:
          ANSWERS_JSON: ${{ secrets.ANSWERS_JSON }}
          ANSWERS_JSON_GZ: ${{ secrets.ANSWERS_JSON_GZ }}
          ANSWERS_JSON_GZ_2: ${{ secrets.ANSWERS_JSON_GZ_2 }}
          ANSWERS_JSON_GZ_3: ${{ secrets.ANSWERS_JSON_GZ_3 }}
          ANSWERS_JSON_GZ_4: ${{ secrets.ANSWERS_JSON_GZ_4 }}
          ANSWERS_JSON_GZ_5: ${{ secrets.ANSWERS_JSON_GZ_5 }}
          ANSWERS_JSON_GZ_6: ${{ secrets.ANSWERS_JSON_GZ_6 }}
          SAFETY_JSON: ${{ secrets.SAFETY_JSON }}
          SAFETY_JSON_GZ: ${{ secrets.SAFETY_JSON_GZ }}
          SAFETY_JSON_GZ_2: ${{ secrets.SAFETY_JSON_GZ_2 }}
          SAFETY_JSON_GZ_3: ${{ secrets.SAFETY_JSON_GZ_3 }}
          SAFETY_JSON_GZ_4: ${{ secrets.SAFETY_JSON_GZ_4 }}
          SAFETY_JSON_GZ_5: ${{ secrets.SAFETY_JSON_GZ_5 }}
          SAFETY_JSON_GZ_6: ${{ secrets.SAFETY_JSON_GZ_6 }}
          BLOCKED_JSON: ${{ secrets.BLOCKED_JSON }}
          BLOCKED_JSON_GZ: ${{ secrets.BLOCKED_JSON_GZ }}
          BLOCKED_JSON_GZ_2: ${{ secrets.BLOCKED_JSON_GZ_2 }}
          BLOCKED_JSON_GZ_3: ${{ secrets.BLOCKED_JSON_GZ_3 }}
          BLOCKED_JSON_GZ_4: ${{ secrets.BLOCKED_JSON_GZ_4 }}
          BLOCKED_JSON_GZ_5: ${{ secrets.BLOCKED_JSON_GZ_5 }}
          BLOCKED_JSON_GZ_6: ${{ secrets.BLOCKED_JSON_GZ_6 }}
        run: |
          write() {
            name="$1"; plain="$2"; packed="$3"
            if [ -n "$packed" ]; then
              printf '%s' "$packed" | base64 -d | gunzip > "public/data/$name" \
                || { echo "::error::$name compressed secret could not be decoded"; exit 1; }
              src="compressed secret"
            elif [ -n "$plain" ]; then
              printf '%s' "$plain" > "public/data/$name"
              src="secret"
            else
              echo "$name: no secret, sample will be used"
              return
            fi
            node -e "JSON.parse(require('fs').readFileSync('public/data/$name','utf8'))" \
              || { echo "::error::$name from $src is not valid JSON"; exit 1; }
            echo "$name: from $src"
          }
          # parts 2..6 are glued onto the first, in order
          glue() { printf '%s%s%s%s%s%s' "$1" "$2" "$3" "$4" "$5" "$6"; }
          write answers.json "$ANSWERS_JSON" "$(glue "$ANSWERS_JSON_GZ" "$ANSWERS_JSON_GZ_2" "$ANSWERS_JSON_GZ_3" "$ANSWERS_JSON_GZ_4" "$ANSWERS_JSON_GZ_5" "$ANSWERS_JSON_GZ_6")"
          write safety.json  "$SAFETY_JSON"  "$(glue "$SAFETY_JSON_GZ" "$SAFETY_JSON_GZ_2" "$SAFETY_JSON_GZ_3" "$SAFETY_JSON_GZ_4" "$SAFETY_JSON_GZ_5" "$SAFETY_JSON_GZ_6")"
          write blocked.json "$BLOCKED_JSON" "$(glue "$BLOCKED_JSON_GZ" "$BLOCKED_JSON_GZ_2" "$BLOCKED_JSON_GZ_3" "$BLOCKED_JSON_GZ_4" "$BLOCKED_JSON_GZ_5" "$BLOCKED_JSON_GZ_6")"

      # The realtime server the site connects to. Without it the build falls back to the
      # in-browser simulation (see frontend/src/main.js).
      - run: npm run build
        env:
          VITE_REALTIME_URL: wss://api.gohaeyaji.com/ws
          # the address printed on the 보속 카드 (src/ui/penance-card.js)
          VITE_SITE_URL: gohaeyaji.com

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
