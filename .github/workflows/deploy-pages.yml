name: Deploy frontend to GitHub Pages

# Builds frontend/ and publishes it to https://<owner>.github.io/<repo>/
# Runs on every push to main that touches the frontend, or by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The real answer copy and word lists are not in the repo.
      # If these repository secrets exist, they are written into public/data before the build.
      # Without them the site falls back to the *.sample.json files.
      # A secret holds at most 48 KB, so each file can also be stored gzipped and base64 encoded
      # as <NAME>_GZ (scripts/set-data-secrets.sh does this). The _GZ secret wins when both exist.
      - name: Write private data files from secrets
        env:
          ANSWERS_JSON: ${{ secrets.ANSWERS_JSON }}
          ANSWERS_JSON_GZ: ${{ secrets.ANSWERS_JSON_GZ }}
          SAFETY_JSON: ${{ secrets.SAFETY_JSON }}
          SAFETY_JSON_GZ: ${{ secrets.SAFETY_JSON_GZ }}
          BLOCKED_JSON: ${{ secrets.BLOCKED_JSON }}
          BLOCKED_JSON_GZ: ${{ secrets.BLOCKED_JSON_GZ }}
        run: |
          write() {
            name="$1"; plain="$2"; packed="$3"
            if [ -n "$packed" ]; then
              printf '%s' "$packed" | base64 -d | gunzip > "public/data/$name" \
                || { echo "::error::$name compressed secret could not be decoded"; exit 1; }
              src="compressed secret"
            elif [ -n "$plain" ]; then
              printf '%s' "$plain" > "public/data/$name"
              src="secret"
            else
              echo "$name: no secret, sample will be used"
              return
            fi
            node -e "JSON.parse(require('fs').readFileSync('public/data/$name','utf8'))" \
              || { echo "::error::$name from $src is not valid JSON"; exit 1; }
            echo "$name: from $src"
          }
          write answers.json "$ANSWERS_JSON" "$ANSWERS_JSON_GZ"
          write safety.json  "$SAFETY_JSON"  "$SAFETY_JSON_GZ"
          write blocked.json "$BLOCKED_JSON" "$BLOCKED_JSON_GZ"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
