# Local development:   docker compose up -d redis      then run the server from the IDE or ./gradlew bootRun
# Everything in Docker: docker compose up --build
#
# The same file is meant to run on the deploy VM later; Caddy (HTTPS) will be added then.
#
# Ports are published on 127.0.0.1 only. Docker writes its own iptables rules, so a port published
# on 0.0.0.0 is open to the internet even when firewalld (or ufw) blocks it. Redis has no password
# here, so it must never be reachable from outside; the server reaches it over the compose network
# as redis:6379. The realtime server is reached from outside only through Caddy (wss on 443).
# To try it from your own machine before Caddy is in place: ssh -L 8080:127.0.0.1:8080 <server>

services:
  redis:
    image: redis:7-alpine
    # Persisted (AOF, written every second, in the redis-data volume): besides short-lived state
    # (booth locks, channel counts, which expire on their own) Redis holds what must outlive a
    # restart: the inquiry box, the answer improvement box (30 days), face reports and bans, and
    # the visit counts. At most one second is lost when the machine stops; RDB snapshots stay off.
    # At most 256 MB; when full, new writes fail instead of silently dropping keys (a dropped
    # booth lock would let two people into one booth)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  realtime-server:
    build: ./realtime-server
    # the JVM takes 75% of this for its heap (Dockerfile: MaxRAMPercentage=75), so about 960 MB.
    # Without a limit it would size itself from the whole machine and could crowd out Redis and Nginx
    mem_limit: 1280m
    environment:
      REDIS_HOST: redis
      ALLOWED_ORIGINS: https://gohaeyaji.com,https://www.gohaeyaji.com,https://hae-gun.github.io,http://localhost:5173
      # private blocked word list for display names (git-ignored); without it only the basic rules apply
      BLOCKED_WORDS_FILE: /data/blocked.json
      # admin page (/admin): empty password = off. Put the real one in backend/.env (git-ignored)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ../frontend/public/data/blocked.json:/data/blocked.json:ro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
