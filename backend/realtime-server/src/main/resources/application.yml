server:
  port: 8080
  shutdown: graceful
  # trust X-Forwarded-For from the reverse proxy (Caddy) so per-IP limits see the real client IP
  forward-headers-strategy: native

spring:
  application:
    name: realtime-server
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# Values follow docs/realtime-protocol.md (v0.4)
gohaeyaji:
  protocol-version: 1
  booth-count: 20
  channel-capacity: 60
  channel-soft-limit: 48          # 80% of capacity; new sessions go to the next channel beyond this
  heartbeat-ms: 10000
  heartbeat-timeout-ms: 30000
  hello-timeout-ms: 10000         # connected but never said hello
  lease-ms: 30000
  idle-limit-ms: 90000
  idle-server-grace-ms: 10000     # server-side safety net fires at limit + grace
  idle-warn-ms: 20000
  idle-danger-ms: 10000
  max-message-bytes: 2048         # a 32x32 face (1024 digits) still fits
  max-connections-per-ip: 20
  server-heartbeat-ms: 5000       # each server refreshes its member counts in Redis
  server-dead-ms: 15000           # counts of a server silent this long are dropped
  presence-ms: 200                # position batch interval (protocol section 13)
  move-min-gap-ms: 150            # drop moves faster than ~5/s (200 ms minus jitter)
  rename-min-gap-ms: 10000        # one name change per 10 s
  face-min-gap-ms: 5000           # one face change per 5 s
  face-report-threshold: 3        # different sessions reporting the same drawing before it is banned
  face-report-window-ms: 3600000  # reports older than 1 h are forgotten
  face-ban-ms: 86400000           # a banned drawing cannot be worn again for 24 h
  face-block-ms: 600000           # whoever wore it cannot set any face for 10 min
  max-reports-per-minute: 10
  admin-keep-ms: 604800000        # the admin page keeps reported drawings for 7 days
  # admin page (/admin). Empty password = admin page off. Set both through environment variables.
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  # private blocked word list (git-ignored), same file the browser uses; relative to the working directory.
  # The default works for ./gradlew bootRun from backend/realtime-server. In Docker, mount the file and set the variable.
  blocked-words-file: ${BLOCKED_WORDS_FILE:../../frontend/public/data/blocked.json}
  allowed-origins: ${ALLOWED_ORIGINS:https://hae-gun.github.io,http://localhost:5173}
