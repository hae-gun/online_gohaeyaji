# ops 서버: Prometheus(지표 수집) + Grafana(대시보드)
# 둘 다 127.0.0.1에만 열고, 맥에서 SSH 터널로 접속한다 (README 참고)
services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?ops/.env에 GRAFANA_PASSWORD를 넣으세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["grafana-data:/var/lib/grafana"]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

volumes:
  prom-data: {}
  grafana-data: {}
