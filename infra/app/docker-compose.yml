# app 서버 앞단: Nginx(TLS, wss), 인증서(certbot), 서버 지표(node_exporter)
# backend/docker-compose.yml 이 먼저 떠 있어야 함 (그 네트워크에 붙어서 realtime-server로 프록시)
#
# 처음 한 번: cp .env.example .env 후 값 채우기 → README의 "도메인 연결" 순서대로
services:
  nginx:
    image: nginx:1.27
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      OPS_IP: ${OPS_IP}
      # 앵로그 (github.com/hae-gun/anglog/infra). 인증서를 먼저 받은 뒤 .env에 넣을 것
      ANGLOG_DOMAIN: ${ANGLOG_DOMAIN:?infra/app/.env에 ANGLOG_DOMAIN을 넣으세요 (앵로그 README 1번 순서)}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
      - ./nginx/anglog.conf.template:/etc/nginx/templates/anglog.conf.template:ro,Z
      - ./data/letsencrypt:/etc/letsencrypt:ro,z
      - ./data/certbot-www:/var/www/certbot:z
      - wiz-data:/srv/wiz:ro
    # anglog-edge: 앵로그 스택의 web 컨테이너 하나만 붙어 있는 네트워크 (docker network create anglog-edge)
    networks: [backend, anglog-edge]
    depends_on: [wiz-presence]
    restart: unless-stopped

  # 한국시리즈 임시 수집기 (/wizpark). 시리즈가 끝나면 이 서비스와 wiz-data, nginx의 /wiz/ 를 지운다
  wiz-relay:
    image: node:22-alpine
    command: ["node", "/app/collector.mjs"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    volumes:
      - ./wiz-relay/collector.mjs:/app/collector.mjs:ro,Z
      - wiz-data:/srv/wiz
    networks: [backend]
    restart: unless-stopped

  # 위즈파크 접속자 위치와 응원 메시지 (채널 2개, 채널당 1000명). 임시 서비스
  wiz-presence:
    image: node:22-alpine
    command: ["node", "/app/presence.mjs"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    environment:
      PORT: "8090"
      WIZ_ADMIN_PASSWORD: ${WIZ_ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: https://wiz.gohaeyaji.com,http://wiz.gohaeyaji.com,https://hae-gun.github.io
    volumes:
      - ./wiz-relay/presence.mjs:/app/presence.mjs:ro,Z
      - ./wiz-relay/admin.html:/app/admin.html:ro,Z
      - wiz-data:/srv/wiz
    networks: [backend]
    restart: unless-stopped

  # 서버 CPU, 메모리, 네트워크 송신량. 호스트 네트워크라 방화벽(firewalld)이 적용됨
  # 9100은 ops 서버 IP에만 열 것 (README 참고)
  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--web.listen-address=:9100"]
    volumes: ["/:/host:ro,rslave"]
    restart: unless-stopped

  # 평소엔 안 뜨고, 인증서 발급과 갱신 때만 docker compose run 으로 사용
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt:z
      - ./data/certbot-www:/var/www/certbot:z

volumes:
  wiz-data: {}

networks:
  backend:
    external: true
    name: backend_default
  anglog-edge:
    external: true
    name: anglog-edge
