<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>고해야지 보속 카드</title>
  <meta name="description" content="오늘의 보속을 받았습니다. 공부해야지, 운동해야지, 그리고 고해야지.">
  <!-- link previews (KakaoTalk and the like): one picture for every card, the page shows the card itself -->
  <meta property="og:title" content="고해야지 보속 카드">
  <meta property="og:description" content="오늘의 보속을 받았습니다. 나도 고해하러 가기">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://gohaeyaji.com/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="theme-color" content="#120d24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
</head>
<body class="cardBody">
  <main class="cardPage">
    <article class="pcard" id="pcard" aria-labelledby="pcTitle" hidden>
      <header class="pcHead">
        <h1 id="pcTitle">고해야지</h1>
        <time id="pcWhen"></time>
      </header>
      <div class="pcWindow">
        <canvas id="pcPriest" aria-label="신부님"></canvas>
        <span class="pcPlate" id="pcPriestName">신부님</span>
      </div>
      <p class="pcMe"><canvas id="pcFace" width="64" height="64" aria-hidden="true"></canvas><span>고해자</span> <b id="pcName"></b></p>
      <div class="pcSin">
        <small>죄목</small>
        <strong id="pcSin"></strong>
        <em id="pcNth"></em>
      </div>
      <div class="pcPaper">
        <small id="pcLabel">오늘의 보속</small>
        <p id="pcPenance"></p>
      </div>
      <p class="pcFoot">실제 고해성사가 아닌 패러디입니다</p>
    </article>
    <p class="pcMissing" id="pcMissing" hidden>이 카드를 열 수 없습니다. 링크가 잘렸거나 오래된 카드입니다.</p>
    <nav class="pcActions">
      <a class="pcGo" href="./">나도 고해하러 가기</a>
      <button id="pcSave" type="button" hidden>이미지로 저장</button>
    </nav>
  </main>
  <script type="module" src="/src/card/page.js"></script>
</body>
</html>
